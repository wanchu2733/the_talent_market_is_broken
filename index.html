<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-glow {
            box-shadow: 0 0 25px -5px rgba(129, 140, 248, 0.4), 0 0 50px -15px rgba(168, 85, 247, 0.25);
        }
        .btn-glow:hover {
            box-shadow: 0 0 35px -3px rgba(129, 140, 248, 0.65), 0 0 65px -10px rgba(168, 85, 247, 0.45);
        }
    </style>
</head>
<body class="bg-[#131314] text-[#e3e3e3] h-screen w-screen flex items-center justify-center m-0 p-0 overflow-hidden relative selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Ambient background glow -->
    <div class="absolute w-[500px] h-[500px] bg-gradient-to-tr from-blue-600/10 to-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Centered Start Challenge Button -->
    <main class="relative z-10">
        <a 
            id="start-challenge-btn" 
            href="studio.html" 
            class="btn-glow inline-flex items-center justify-center gap-3 px-10 py-5 rounded-2xl bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 hover:from-blue-400 hover:via-indigo-400 hover:to-purple-500 text-white font-semibold text-lg tracking-wide transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 group cursor-pointer">
            <span>Start Challenge</span>
            <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
        </a>
    </main>

</body>
</html>
